<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MORIQ · 转换圆盘设计方案</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#121724;background:#f4f5f8;--ink:#171b24;--muted:#818897;--line:#e4e7ee;--blue:#2963f6;--field:#fafbfe;--bg:#f4f5f8;--text:#171b24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}body.dark{--bg:#101318;--field:#181c23;--text:#f5f7fc;--ink:#f4f5f8;--muted:#969dab;--line:#303640}header{max-width:1500px;margin:auto;padding:48px 5vw 26px;display:flex;justify-content:space-between;align-items:start;gap:20px}.brand{letter-spacing:.17em;font-size:12px;font-weight:750;color:var(--blue)}h1{font-size:clamp(25px,3vw,40px);letter-spacing:-.04em;margin:12px 0 10px}header p{font-size:14px;color:var(--muted);margin:0;line-height:1.7}button{font:inherit;cursor:pointer}#theme{background:none;border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:11px}main{max-width:1500px;margin:auto;padding:0 5vw 54px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.option{min-width:0}.heading{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}.number{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.1em}.heading h2{font-size:19px;margin:0;letter-spacing:-.02em}.caption{font-size:13px;line-height:1.65;color:var(--muted);min-height:44px;margin:0 0 18px}.canvas{height:462px;background:var(--field);border-radius:18px;position:relative;overflow:hidden;touch-action:none}.canvas:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(50,100,240,.045),transparent 60%);pointer-events:none}.wheel{position:absolute;width:min(96%,380px);aspect-ratio:1;left:50%;top:47%;transform:translate(-50%,-50%);overflow:visible}.part{cursor:pointer;transition:fill .22s ease,stroke .22s ease,filter .22s ease}.label{font-size:11px;font-weight:650;text-anchor:middle;dominant-baseline:middle;pointer-events:none;fill:var(--ink);transition:fill .2s ease;font-family:inherit}.scheme-1 .part{fill:rgba(205,213,229,.20);stroke:rgba(113,129,157,.20);stroke-width:.7}.scheme-1 .part.active{fill:rgba(55,106,255,.18);stroke:#3571ff;stroke-width:1.2;filter:drop-shadow(0 0 5px rgba(46,102,255,.15))}.scheme-2 .part{fill:rgba(207,216,232,.11);stroke:rgba(118,132,158,.28);stroke-width:.8}.scheme-2 .part.active{fill:rgba(43,99,244,.12);stroke:#3474ff;stroke-width:1.5;filter:drop-shadow(0 0 4px rgba(46,102,255,.25))}.scheme-3 .part{fill:rgba(227,231,239,.26);stroke:rgba(132,143,160,.16);stroke-width:.7}.scheme-3 .part.active{fill:#2963f6;stroke:#2963f6;stroke-width:1.1;filter:drop-shadow(0 3px 7px rgba(41,99,246,.22))}.part.active+.label{fill:#1d59eb}.scheme-3 .part.active+.label{fill:white}.orbit{fill:none;stroke:rgba(110,135,180,.16);stroke-width:.8;pointer-events:none}.scheme-2 .orbit{stroke:rgba(72,112,202,.23)}.file{position:absolute;left:18px;bottom:19px;border:0;background:none;color:var(--ink);padding:5px;display:flex;align-items:center;gap:9px;touch-action:none;user-select:none;cursor:grab;font-size:12px;font-weight:600;z-index:4}.file:active{cursor:grabbing}.file-icon{width:32px;height:38px;border-radius:7px;background:#e5edff;color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:800;box-shadow:0 3px 10px rgba(56,104,216,.12)}.feedback{position:absolute;right:22px;bottom:22px;text-align:right;color:var(--muted);font-size:12px;transition:color .2s;min-height:16px}.feedback.active{color:var(--blue)}.ghost{position:fixed;display:none;z-index:20;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg);width:37px;height:43px;border-radius:8px;background:#e8eeff;color:#2864f5;box-shadow:0 8px 28px #18243b35;place-items:center;font-weight:800;font-size:12px}.ghost.show{display:grid}footer{max-width:1500px;margin:auto;padding:0 5vw 50px;font-size:13px;color:var(--muted);line-height:1.7}.dark .scheme-1 .part{fill:rgba(170,185,215,.09);stroke:rgba(188,204,237,.20)}.dark .scheme-2 .part{fill:rgba(170,185,215,.06);stroke:rgba(188,204,237,.22)}.dark .scheme-3 .part{fill:rgba(170,185,215,.10);stroke:rgba(188,204,237,.14)}.dark .scheme-3 .part.active{fill:#4778ff}.dark .label{fill:#d8dfed}.dark .part.active+.label{fill:#8db4ff}.dark .scheme-3 .part.active+.label{fill:white}.replay{position:absolute;z-index:3;top:16px;right:18px;border:0;background:transparent;color:#697586;font-size:12px;padding:8px;border-radius:8px}.replay:hover{color:#2963f6;background:rgba(41,99,246,.06)}.wheel.opening{animation:wheelIn .52s cubic-bezier(.18,.8,.2,1) both}.wheel.opening .part,.wheel.opening .label{animation:partIn .42s cubic-bezier(.18,.8,.2,1) both}@keyframes wheelIn{from{opacity:0;transform:translate(-50%,-50%) scale(.87) rotate(-3deg)}to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}@keyframes partIn{from{opacity:0}to{opacity:1}}@media(max-width:1050px){main{grid-template-columns:1fr;max-width:620px}.canvas{height:440px}.caption{min-height:0}header{max-width:620px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important;animation-delay:0ms!important}}
</style></head><body><header><div><div class="brand">MORIQ / CONVERSION WHEEL</div><h1>选一个更顺手的圆盘。</h1><p>按住左下角的示例文件，拖过不同格式，感受每一格的反馈。松开可预览完成状态。按 Shift 或点击“重播唤出”查看展开动效。</p></div></header><main>
<section class="option scheme-1"><div class="heading"><span class="number">01</span><h2>柔雾玻璃</h2></div><p class="caption">轻透分区，边界若隐若现。经过时蓝色从触点轻轻浮起。</p><div class="canvas"><button class="replay" type="button">↻　重播唤出</button><svg class="wheel" viewBox="0 0 380 380" aria-label="柔雾玻璃圆盘"></svg><button class="file" aria-label="拖动示例文件"><span class="file-icon">IMG</span><span>照片.heic</span></button><div class="feedback">拖动文件试试</div></div></section>
<section class="option scheme-2"><div class="heading"><span class="number">02</span><h2>轨道微光</h2></div><p class="caption">更轻的轮廓和细线层次，经过时轮廓点亮，像光沿轨道移动。</p><div class="canvas"><button class="replay" type="button">↻　重播唤出</button><svg class="wheel" viewBox="0 0 380 380" aria-label="轨道微光圆盘"></svg><button class="file" aria-label="拖动示例文件"><span class="file-icon">IMG</span><span>照片.heic</span></button><div class="feedback">拖动文件试试</div></div></section>
<section class="option scheme-3"><div class="heading"><span class="number">03</span><h2>灵动色块</h2></div><p class="caption">静止时干净克制，经过的区域柔和点亮，选择状态更清晰。</p><div class="canvas"><button class="replay" type="button">↻　重播唤出</button><svg class="wheel" viewBox="0 0 380 380" aria-label="灵动色块圆盘"></svg><button class="file" aria-label="拖动示例文件"><span class="file-icon">IMG</span><span>照片.heic</span></button><div class="feedback">拖动文件试试</div></div></section>
</main><footer>示例仅用于选择视觉与动效方向，不会读取或转换你的文件。实际圆盘会根据文件类型展示对应格式，空间不足时分为两层。</footer><div class="ghost">IMG</div><script>
const names=[['PNG','JPG','PDF','WEBP','TIFF','GIF','BMP','AVIF'],['HEIC','JP2','ZIP','TAR']];const ns='http://www.w3.org/2000/svg';function polar(r,a){return [190+r*Math.cos(a),190+r*Math.sin(a)]}function path(r1,r2,a,b){let p=polar(r2,a),q=polar(r2,b),t=polar(r1,b),u=polar(r1,a);return `M${p} A${r2},${r2} 0 0 1 ${q} L${t} A${r1},${r1} 0 0 0 ${u} Z`}document.querySelectorAll('.option').forEach(option=>{const svg=option.querySelector('svg');for(const r of [54,119,184]){let c=document.createElementNS(ns,'circle');c.setAttribute('cx',190);c.setAttribute('cy',190);c.setAttribute('r',r);c.setAttribute('class','orbit');svg.append(c)}names.forEach((ring,layer)=>ring.forEach((name,i)=>{let n=ring.length,center=-Math.PI/2+(i+.5)*2*Math.PI/n,gap=layer?0.038:.025,start=-Math.PI/2+i*2*Math.PI/n+gap,end=-Math.PI/2+(i+1)*2*Math.PI/n-gap,r1=layer?56:122,r2=layer?116:182;let part=document.createElementNS(ns,'path');part.setAttribute('d',path(r1,r2,start,end));part.setAttribute('class','part');part.dataset.name=name;part.style.animationDelay=(i*.018+layer*.035)+"s";part.setAttribute('tabindex','0');part.setAttribute('role','button');part.setAttribute('aria-label',name);let label=document.createElementNS(ns,'text');let [x,y]=polar((r1+r2)/2,center);label.setAttribute('x',x);label.setAttribute('y',y);label.setAttribute('class','label');label.style.animationDelay=(i*.018+layer*.035)+"s";label.textContent=name;svg.append(part,label);part.addEventListener('pointerenter',()=>activate(option,part));part.addEventListener('pointerleave',()=>activate(option,null));part.addEventListener('focus',()=>activate(option,part));part.addEventListener('blur',()=>activate(option,null));part.addEventListener('click',()=>done(option,part))}));});function activate(option,part){option.querySelectorAll('.part.active').forEach(x=>x.classList.remove('active'));if(part)part.classList.add('active');const f=option.querySelector('.feedback');f.textContent=part?'松开转换为 '+part.dataset.name:'拖动文件试试';f.classList.toggle('active',!!part)}function done(option,part){if(!part)return;const f=option.querySelector('.feedback');f.textContent='已选择 '+part.dataset.name+' · 效果预览';f.classList.add('active');setTimeout(()=>{if(!option.querySelector('.part.active')){f.textContent='拖动文件试试';f.classList.remove('active')}},1600)}let current=null;const ghost=document.querySelector('.ghost');document.querySelectorAll('.file').forEach(file=>{file.addEventListener('pointerdown',e=>{e.preventDefault();current=file.closest('.option');ghost.classList.add('show');ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';file.setPointerCapture(e.pointerId)});file.addEventListener('pointermove',e=>{if(!current)return;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';let el=document.elementFromPoint(e.clientX,e.clientY);activate(current,el?.classList.contains('part')&&current.contains(el)?el:null)});file.addEventListener('pointerup',e=>{if(!current)return;let p=current.querySelector('.part.active');ghost.classList.remove('show');activate(current,null);done(current,p);current=null});file.addEventListener('pointercancel',()=>{ghost.classList.remove('show');if(current)activate(current,null);current=null})});function replay(option){const wheel=option.querySelector('.wheel');wheel.classList.remove('opening');void wheel.getBoundingClientRect();wheel.classList.add('opening');wheel.addEventListener('animationend',()=>wheel.classList.remove('opening'),{once:true})}document.querySelectorAll('.option').forEach(o=>{o.querySelector('.replay').addEventListener('click',()=>replay(o));replay(o)});window.addEventListener('keydown',e=>{if(e.key==='Shift'&&!e.repeat)document.querySelectorAll('.option').forEach(replay)});
</script></body></html>
